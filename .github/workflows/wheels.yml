
name: Wheels
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PIP_NO_VERIFY: 0
  PIP_VERBOSE: 1
  CIBW_BEFORE_BUILD: pip install -U setuptools Cython wheel meson-python ninja && pip install -U numpy
  CIBW_SKIP: "pp* cp39-* cp310-* cp313t*"

jobs:
  build_linux_x86_64:
    name: Build Linux x86_64 wheels
    strategy:
      matrix:
        os: ["ubuntu-24.04"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_ENVIRONMENT_PASS_LINUX: CFLAGS
          CFLAGS: -D_GNU_SOURCE
          CIBW_TEST_SKIP: "cp*-musllinux*"
          CIBW_TEST_COMMAND: >
            cd .. &&
            pytest -k "not RSI and not threading" {project}/tests
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD_FRONTEND: build
          CIBW_ENVIRONMENT_LINUX : >
            PIP_NO_BUILD_ISOLATION=false
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: "ta_lib-${{ github.ref_name }}-linux_x86_64"
  build_linux_arm64:
    name: Build Linux arm64 wheels
    strategy:
      matrix:
        os: ["ubuntu-24.04-arm"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MUSLLINUX_AARCH64_IMAGE: musllinux_1_2
          CIBW_ENVIRONMENT_PASS_LINUX: CFLAGS
          CFLAGS: -D_GNU_SOURCE
          CIBW_TEST_SKIP: "cp*-musllinux*"
          CIBW_TEST_COMMAND: >
            cd .. &&
            pytest -k "not RSI and not threading" {project}/tests
          CIBW_ARCHS_LINUX: aarch64
          CIBW_BUILD_FRONTEND: build
          CIBW_ENVIRONMENT_LINUX : >
            PIP_NO_BUILD_ISOLATION=false
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: "ta_lib-${{ github.ref_name }}-linux_arm64"
  build_windows_amd64:
    name: Build Windows amd64 wheels
    strategy:
      matrix:
        os: ["windows-2025-vs2026"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Set up MSVC for x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_TEST_SKIP: "cp*"
          CIBW_TEST_COMMAND: >
            cd .. &&
            pytest --rootdir=C: -k "not RSI and not threading" {project}/tests
          MSBUILDTREATHIGHERTOOLSVERSIONASCURRENT: 1
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT_WINDOWS: >
            PIP_NO_BUILD_ISOLATION=false
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: "ta_lib-${{ github.ref_name }}-win_amd64"
  build_windows_x86:
    name: Build Windows x86 wheels
    strategy:
      matrix:
        os: ["windows-2025-vs2026"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Set up MSVC for x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_TEST_SKIP: "cp*"
          CIBW_TEST_COMMAND: >
            cd .. &&
            pytest --rootdir=C: -k "not RSI and not threading" {project}/tests
          MSBUILDTREATHIGHERTOOLSVERSIONASCURRENT: 1
          CIBW_ARCHS_WINDOWS: x86
          CIBW_ENVIRONMENT_WINDOWS: >
            PIP_NO_BUILD_ISOLATION=false
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: "ta_lib-${{ github.ref_name }}-win32"
  build_windows_arm64:
    name: Build Windows arm64 wheels
    strategy:
      matrix:
        os: ["windows-11-vs2026-arm"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Set up MSVC for arm
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_TEST_SKIP: "cp*"
          CIBW_TEST_COMMAND: >
            cd .. &&
            pytest --rootdir=C: -k "not RSI and not threading" {project}/tests
          MSBUILDTREATHIGHERTOOLSVERSIONASCURRENT: 1
          CIBW_ARCHS_WINDOWS: ARM64
          CIBW_ENVIRONMENT_WINDOWS: >
            PIP_NO_BUILD_ISOLATION=false
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: "ta_lib-${{ github.ref_name }}-win_arm64"
  build_macos_x86_64:
    name: Build MacOS x86_64 wheels
    strategy:
      matrix:
        os: [macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_TEST_COMMAND: >
            cd .. &&
            pytest -k "not RSI and not threading" {project}/tests
          CIBW_ARCHS_MACOS: x86_64
          CIBW_ENVIRONMENT_MACOS : >
            MACOSX_DEPLOYMENT_TARGET=13.7
            PIP_NO_BUILD_ISOLATION=false
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: "ta_lib-${{ github.ref_name }}-macos_x86_64"
  build_macos_arm64:
    name: Build MacOS arm64 wheels
    strategy:
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_TEST_COMMAND: >
            cd .. &&
            pytest -k "not RSI and not threading" {project}/tests
          CIBW_ARCHS_MACOS: arm64
          CIBW_ENVIRONMENT_MACOS : >
            MACOSX_DEPLOYMENT_TARGET=14.0
            PIP_NO_BUILD_ISOLATION=false
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: "ta_lib-${{ github.ref_name }}-macos_arm64"
